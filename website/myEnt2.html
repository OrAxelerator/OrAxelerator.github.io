<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scroll tactile menu</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  body {
    display: flex;
  }
  nav {
    position: fixed;
    top: 0; left: 0;
    width: 120px;
    height: 100vh;
    background: #222;
    display: flex;
    flex-direction: column;
    padding: 1rem;
    z-index: 10;
    user-select: none; /* pour éviter sélection lors swipe */
    touch-action: none; /* empêche le scroll natif sur mobile */
  }
  nav a {
    color: #ccc;
    text-decoration: none;
    margin: 1rem 0;
    font-weight: bold;
    cursor: pointer;
  }
  nav a.active {
    color: #0f0;
  }
  main {
    flex-grow: 1;
    width: calc(100vw - 120px);
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  section {
    width: 100%;
    height: 100vh;
    position: absolute;
    top: 0; left: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3rem;
    color: white;
    transition: transform 0.5s ease;
  }
  #section1 {
    background: #e74c3c;
  }
  #section2 {
    background: #3498db;
    transform: translateY(100%);
  }
  #section3 {
    background: #2ecc71;
    transform: translateY(200%);
  }
</style>
</head>
<body>

<nav id="nav">
  <a href="#section1" class="active" data-index="0">Accueil</a>
  <a href="#section2" data-index="1">Services</a>
  <a href="#section3" data-index="2">Contact</a>
</nav>

<main id="main">
  <section id="section1">Accueil</section>
  <section id="section2">Services</section>
  <section id="section3">Contact</section>
</main>

<script>
  const sections = document.querySelectorAll('section');
  const navLinks = document.querySelectorAll('nav a');
  const nav = document.getElementById('nav');
  let currentIndex = 0;
  let isAnimating = false;

  function updateMenu() {
    navLinks.forEach(link => link.classList.remove('active'));
    navLinks[currentIndex].classList.add('active');
  }

  function showSection(index) {
    if(index < 0 || index >= sections.length) return;
    if(isAnimating) return;
    isAnimating = true;
    currentIndex = index;

    sections.forEach((section, i) => {
      section.style.transform = `translateY(${100 * (i - currentIndex)}%)`;
    });
    updateMenu();

    setTimeout(() => {
      isAnimating = false;
    }, 600);
  }

  // Gestion du swipe tactile sur le menu
  let startY = 0;
  let endY = 0;

  nav.addEventListener('touchstart', e => {
    if(isAnimating) return;
    startY = e.touches[0].clientY;
  });

  nav.addEventListener('touchmove', e => {
    if(isAnimating) return;
    endY = e.touches[0].clientY;
  });

  nav.addEventListener('touchend', e => {
    if(isAnimating) return;
    let diff = startY - endY;
    if(diff > 50) {
      showSection(currentIndex + 1);
    } else if(diff < -50) {
      showSection(currentIndex - 1);
    }
  });

  navLinks.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const index = parseInt(link.dataset.index);
      showSection(index);
    });
  });

  showSection(0);
</script>

</body>
</html>
